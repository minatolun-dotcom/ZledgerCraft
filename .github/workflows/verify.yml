name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - name: Engine tests
        run: node --test tests/
      - name: Build single file
        run: node build.mjs

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: tools/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - name: Install dev tooling
        run: npm ci
      - name: Install browser and host libraries
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser suite
        run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.browser }}
          path: tools/browser/.artifacts/${{ matrix.browser }}
          if-no-files-found: ignore
