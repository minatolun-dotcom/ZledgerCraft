      const warnings = ['Part B (transporter, vehicle and distance) is not captured; add it in the portal.'];
      if (!seller.address || !seller.city || !seller.pin) warnings.push('Seller address or PIN is incomplete.');
      if (!buyer.address || !buyer.city || !buyer.pin) warnings.push('Buyer address or PIN is incomplete.');
      if (lines.some((line) => !line.hsn)) warnings.push('HSN / SAC is missing on one or more lines.');
      return {
        ...document,
        voucherId: document.id,
        seller,
        buyer,
        lines,
        threshold,
        warnings,
        ready: Boolean(
          seller.gstin && seller.address && seller.city && seller.pin &&
            buyer.address && buyer.city && buyer.pin && buyer.stateCode,
        ),
        payload: voucher
          ? ewayPayload(company, document, voucher, seller, buyer, lines)
          : null,
      };
    });
  return {
    from,
    to,
    threshold,
    seller,
    rows,
    count: rows.length,
    value: round2(rows.reduce((sum, row) => sum + row.total, 0)),
    note: 'Invoices below the threshold are excluded. Part A only; Part B details are not captured.',
  };
}

const TAX_AUDIT_CLAUSES = [
  ['9', 'Nature of business', 'Describe the business and principal products or services.'],
  ['11', 'Books of account', 'Presumptive taxation, books maintained and audit trail.'],
  ['13', 'Method of accounting', 'Mercantile or cash, and any change during the year.'],
  ['20(b)', 'GST input tax credit', 'Reconcile ITC claimed with books and GSTR-3B.'],
  ['21', 'Amounts not credited to profit', 'List amounts credited outside the profit and loss account.'],
  ['22', 'MSME dues', 'Outstanding dues to micro and small enterprises beyond the limit.'],
  ['26', 'Section 43B payments', 'Payments claimed on actual payment basis.'],
  ['31', 'Loans, deposits and advances', 'Details of loans, deposits and advances requiring disclosure.'],
  ['34', 'TDS / TCS compliance', 'Deducted, collected, paid and outstanding tax.'],
  ['44', 'Expenditure details', 'Break-up of expenses requiring clause 44 disclosure.'],
];

/**
 * Tax-audit working papers: turnover, GST liability and ITC reconciliations,
 * TDS/TCS position, and a Form 3CD-style clause checklist. Informational only.
 */
function taxAuditSummary(company, filters = {}) {
  const from = filters.from || company.fyStart;
  const to = filters.to || company.fyEnd;
  const gst = gstReturns(company, { from, to });
  const totals = ledgerTotals(company, { from, to });
  const ledgerRows = company.ledgers.map((ledger) => ({
    ledger,
    total: totals.get(ledger.id),
  }));
  const periodNet = (ledger) => {
    const total = totals.get(ledger.id);
    return total ? round2(total.periodCredit - total.periodDebit) : 0;
  };

  const salesRows = ledgerRows
    .filter(({ ledger }) => inGroupKey(company, ledger, 'sales'))
    .map(({ ledger, total }) => ({
      ledgerId: ledger.id,
      name: ledger.name,
      amount: round2((total?.periodCredit ?? 0) - (total?.periodDebit ?? 0)),
    }))
    .filter((row) => Math.abs(row.amount) >= EPSILON);
  const booksTurnover = round2(salesRows.reduce((sum, row) => sum + row.amount, 0));
  const otherIncomeRows = ledgerRows
    .filter(({ ledger }) => inGroupKey(company, ledger, 'directIncomes'))
    .map(({ ledger, total }) => ({
      ledgerId: ledger.id,
      name: ledger.name,
      amount: round2((total?.periodCredit ?? 0) - (total?.periodDebit ?? 0)),
    }))
    .filter((row) => Math.abs(row.amount) >= EPSILON);

  const taxRows = company.ledgers
    .filter((ledger) => ledger.gstRole)
    .map((ledger) => ({
      role: ledger.gstRole,
      name: ledger.name,
      amount: periodNet(ledger),
    }));
  const outputTaxBooks = round2(
    taxRows.reduce((sum, row) => sum + Math.max(0, row.amount), 0),
  );
  const itcBooks = round2(
    taxRows.reduce((sum, row) => sum + Math.max(0, -row.amount), 0),
  );
  const outputTaxReturns = gst.gstr3b.liabilityTotal;
  const itcReturns = gst.gstr3b.itcTotal;
  const difference = (books, returns) => round2(books - returns);

  const tds = withholdingSummary(company, { kind: 'TDS', from, to });
  const tcs = withholdingSummary(company, { kind: 'TCS', from, to });
  const voucherCount = (company.vouchers ?? []).filter(
    (voucher) => voucher.date >= from && voucher.date <= to,
  ).length;

  const statusFor = (amount) => (Math.abs(amount) < 1 ? 'Ready' : 'Review');
  const clauses = TAX_AUDIT_CLAUSES.map(([clause, title, description]) => {
    if (clause === '20(b)') {
      return {
        clause,
        title,
        description,
        status: statusFor(difference(itcBooks, itcReturns)),
        evidence: `Books ${round2(itcBooks)} vs GSTR-3B ${round2(itcReturns)}`,
      };
    }
    if (clause === '34') {
      const outstanding = round2(tds.outstanding + tcs.outstanding);
      return {
        clause,
        title,
        description,
        status: Math.abs(outstanding) < EPSILON ? 'Ready' : 'Review',
        evidence: `TDS outstanding ${tds.outstanding}, TCS outstanding ${tcs.outstanding}`,
      };
    }
    if (clause === '11') {
      return {
        clause,
        title,
        description,
        status: voucherCount ? 'Review' : 'Ready',
        evidence: `${voucherCount} voucher${voucherCount === 1 ? '' : 's'} in the period; audit trail is maintained`,
      };
    }
    if (clause === '13') {
      return { clause, title, description, status: 'Ready', evidence: 'Mercantile method assumed from voucher posting' };
    }
    if (clause === '9') {
      return {
        clause,
        title,
        description,
        status: company.gst?.legalName ? 'Review' : 'Manual',
        evidence: company.gst?.legalName || 'Registered legal name is not set',
      };
    }
    return { clause, title, description, status: 'Manual', evidence: 'Requires documents outside this app' };
  });

  return {
    from,
    to,
    enabled: Boolean(company.gst?.enabled),
    turnover: {
      books: booksTurnover,
      salesRows,
      otherIncome: round2(otherIncomeRows.reduce((sum, row) => sum + row.amount, 0)),
      otherIncomeRows,
      gstTaxable: gst.outward.taxable,
      gstGross: gst.totals.gross,
      difference: difference(booksTurnover, gst.outward.taxable),
      threshold: 10000000,
      highThreshold: 100000000,
      status: booksTurnover > 100000000 ? 'Review high threshold' : booksTurnover > 10000000 ? 'Review' : 'Below ₹1 crore',
    },
    outputTax: {
      books: outputTaxBooks,
      returns: outputTaxReturns,
      difference: difference(outputTaxBooks, outputTaxReturns),
      rows: taxRows,
    },
    itc: {
      books: itcBooks,
      returns: itcReturns,
      difference: difference(itcBooks, itcReturns),
    },
    taxPosition: {
      tds: { deducted: tds.periodAmount, paid: tds.challanTotal, outstanding: tds.outstanding },
      tcs: { collected: tcs.periodAmount, paid: tcs.challanTotal, outstanding: tcs.outstanding },
    },
    clauses,
    clauseSummary: {
      ready: clauses.filter((clause) => clause.status === 'Ready').length,
      review: clauses.filter((clause) => clause.status === 'Review').length,
      manual: clauses.filter((clause) => clause.status === 'Manual').length,
    },
    note: 'Informational working papers only. Form 3CD, audit applicability and disclosures must be completed by a chartered accountant.',
  };
}

// ---- src/tally.js ----
// Tally XML import helpers. Parses common All Masters and voucher exports
// without adding an XML dependency, then applies the data all-or-nothing.

const VOUCHER_ALIASES = {
  sales: 'Sales',
  purchase: 'Purchase',
  payment: 'Payment',
  receipt: 'Receipt',
  contra: 'Contra',
  journal: 'Journal',
  creditnote: 'CreditNote',
  debitnote: 'DebitNote',
};

function decodeXml(value) {
  return String(value ?? '')
    .replace(/&#x([0-9a-f]+);/gi, (_, hex) => String.fromCodePoint(parseInt(hex, 16)))
    .replace(/&#([0-9]+);/g, (_, code) => String.fromCodePoint(Number(code)))
    .replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&amp;/g, '&');
}

function cleanXmlText(value) {
  return decodeXml(
    String(value ?? '')
      .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1')
      .replace(/<[^>]*>/g, ''),
  ).trim();
}

function escapeRegExp(value) {
  return String(value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function tagText(xml, name) {
  const tag = escapeRegExp(name);
  const match = String(xml ?? '').match(
    new RegExp(`<\\s*${tag}\\b[^>]*>([\\s\\S]*?)<\\s*/\\s*${tag}\\s*>`, 'i'),
  );
  return match ? cleanXmlText(match[1]) : '';
}

function attrValue(attrs, name) {
  const tag = escapeRegExp(name);
  const match = String(attrs ?? '').match(
    new RegExp(`\\b${tag}\\s*=\\s*(?:"([^"]*)"|'([^']*)')`, 'i'),
  );
  return match ? decodeXml(match[1] ?? match[2] ?? '').trim() : '';
}

function isoFromTallyDate(raw) {
  const text = String(raw ?? '').trim();
  let iso = text;
  if (/^\d{8}$/.test(text)) iso = `${text.slice(0, 4)}-${text.slice(4, 6)}-${text.slice(6, 8)}`;
  else {
    const match = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
    if (match) iso = `${match[3]}-${match[2].padStart(2, '0')}-${match[1].padStart(2, '0')}`;
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  const date = new Date(`${iso}T00:00:00Z`);
  return date.toISOString().slice(0, 10) === iso ? iso : null;
}

function normaliseVoucherType(raw) {
  const key = String(raw ?? '').toLowerCase().replace(/[^a-z]/g, '');
  return VOUCHER_ALIASES[key] ?? null;
}

/** Tally quantities and rates can carry a unit suffix, e.g. "10 Nos" or "100/Nos". */
function tallyNumber(raw, parser) {
  const text = cleanXmlText(raw).replace(/,/g, '');
  const match = text.match(/^-?\d+(?:\.\d+)?/);
  return match ? parser(match[0]) : null;
}

/**
 * Resolves parsed Tally inventory rows against a company. Stock enrichment is
 * optional: an error means the voucher should keep its accounting lines only.
 */
function resolveInventory(target, voucher) {
  if (voucher.inventoryError) return { error: voucher.inventoryError };
  if (!voucher.inventory?.length) return { items: [] };
  if (!INVENTORY_TYPES.includes(voucher.type)) {
    return { error: `Stock lines are not supported on ${voucher.type} vouchers.` };
  }
  const items = [];
  let total = 0;
  for (const line of voucher.inventory) {
    const item = (target.stockItems ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === line.itemName.trim().toLowerCase(),
    );
    if (!item) return { error: `Stock item "${line.itemName}" does not exist here.` };
    const godown = line.godownName
      ? (target.godowns ?? []).find(
          (entry) => entry.name.trim().toLowerCase() === line.godownName.trim().toLowerCase(),
        )
      : (target.godowns ?? []).find((entry) => entry.id === defaultGodownId(target));
    if (!godown) {
      return {
        error: line.godownName
          ? `Godown "${line.godownName}" does not exist here.`
          : 'This company has no godown for the stock line.',
      };
    }
    const batchNo = item.batchTracking ? String(line.batchNo ?? '').trim() : '';
    if (item.batchTracking && !batchNo) {
      return { error: `Batch is required for stock item "${item.name}".` };
    }
    const expiryDate = item.batchTracking ? String(line.expiryDate ?? '').trim() : '';
    if (expiryDate && !isValidIsoDate(expiryDate)) {
      return { error: `Expiry date for stock item "${item.name}" is invalid.` };
    }
    const amount = round2(line.qty * line.rate);
    total = round2(total + amount);
    items.push({
      stockItemId: item.id,
      qty: line.qty,
      rate: line.rate,
      godownId: godown.id,
      ...(batchNo ? { batchNo } : {}),
      ...(expiryDate ? { expiryDate } : {}),
    });
  }
  const voucherTotal = round2(
    (voucher.lines ?? voucher.entries ?? [])
      .filter((line) => line.side === 'Dr')
      .reduce((sum, line) => sum + line.amount, 0),
  );
  if (Math.abs(total - voucherTotal) >= 0.01) {
    return {
      error: `Stock lines total ${total.toFixed(2)} but the voucher is ${voucherTotal.toFixed(2)}; use the voucher screen for this GST or discount split.`,
    };
  }
  return { items };
}

/**
 * Parses the subset of Tally XML used by All Masters and voucher exports.
 * It returns raw ledgers and vouchers; company validation happens in
 * importTallyXml so a bad row can never leave a half-applied import.
 */
function parseTallyXml(xml) {
  const text = String(xml ?? '').trim();
  if (!text) return { ok: false, error: 'Paste or choose a Tally XML export.' };
  if (!/<[A-Za-z][^>]*>/.test(text)) return { ok: false, error: 'That does not look like Tally XML.' };

  const groups = [];
  for (const match of text.matchAll(/<GROUP\b([^>]*?)(?:\/>|>([\s\S]*?)<\/GROUP\s*>)/gi)) {
    const body = match[2] ?? '';
    const name = attrValue(match[1], 'NAME') || tagText(body, 'NAME');
    if (!name) return { ok: false, error: 'A Tally account group is missing its NAME attribute.' };
    groups.push({ name, parent: tagText(body, 'PARENT') });
  }

  const stockGroups = [];
  for (const match of text.matchAll(/<STOCKGROUP\b([^>]*)>([\s\S]*?)<\/STOCKGROUP\s*>/gi)) {
    const name = attrValue(match[1], 'NAME') || tagText(match[2], 'NAME');
    if (!name) return { ok: false, error: 'A Tally stock group is missing its NAME attribute.' };
    stockGroups.push({ name, parent: tagText(match[2], 'PARENT') });
  }

  const stockItems = [];
  for (const match of text.matchAll(/<STOCKITEM\b([^>]*)>([\s\S]*?)<\/STOCKITEM\s*>/gi)) {
    const body = match[2];
    const name = attrValue(match[1], 'NAME') || tagText(body, 'NAME');
    if (!name) return { ok: false, error: 'A Tally stock item is missing its NAME attribute.' };
    const parent = tagText(body, 'PARENT');
    if (!parent) return { ok: false, error: `Tally stock item "${name}" is missing its stock group.` };
    const unitName = tagText(body, 'BASEUNITS');
    if (!unitName) return { ok: false, error: `Tally stock item "${name}" is missing its base unit.` };
    const openingRaw = tagText(body, 'OPENINGBALANCE').replace(/,/g, '');
    const openingQty = openingRaw ? parseQty(openingRaw) : 0;
    if (openingQty === null || openingQty < 0) {
      return { ok: false, error: `Tally stock item "${name}" has an invalid opening quantity.` };
    }
    const rateRaw = tagText(body, 'OPENINGRATE').replace(/,/g, '');
    let openingRate = rateRaw ? parseAmount(rateRaw) : 0;
    if (openingRate === null || openingRate < 0) {
      return { ok: false, error: `Tally stock item "${name}" has an invalid opening rate.` };
    }
    if (!rateRaw && openingQty > 0) {
      const valueRaw = tagText(body, 'OPENINGVALUE').replace(/,/g, '');
      const openingValue = valueRaw ? parseAmount(valueRaw) : null;
      if (openingValue !== null && openingValue >= 0) openingRate = round2(openingValue / openingQty);
    }
    stockItems.push({
      name,
      parent,
      unitName,
      openingQty,
      openingRate,
      hsn: tagText(body, 'HSNCODE') || tagText(body, 'HSN'),
    });
  }

  const ledgers = [];
  for (const match of text.matchAll(/<LEDGER\b([^>]*)>([\s\S]*?)<\/LEDGER\s*>/gi)) {
    const attrs = match[1];
    const body = match[2];
    const name = attrValue(attrs, 'NAME') || tagText(body, 'NAME');
    if (!name) return { ok: false, error: 'A Tally ledger is missing its NAME attribute.' };
    const parent = tagText(body, 'PARENT');
    if (!parent) return { ok: false, error: `Tally ledger "${name}" is missing its PARENT group.` };
    const openingRaw = tagText(body, 'OPENINGBALANCE').replace(/,/g, '');
    const openingAmount = openingRaw ? parseAmount(openingRaw) : 0;
    if (openingAmount === null) {
      return { ok: false, error: `Tally ledger "${name}" has an invalid opening balance.` };
    }
    const deemed = tagText(body, 'ISDEEMEDPOSITIVE').toLowerCase();
    const openingType = deemed === 'no' || (!deemed && openingAmount < 0) ? 'Cr' : 'Dr';
    ledgers.push({
      name,
      parent,
      opening: Math.abs(openingAmount),
      openingType,
      gstin: tagText(body, 'PARTYGSTIN') || tagText(body, 'GSTIN'),
      pan: tagText(body, 'INCOMETAXNUMBER'),
    });
  }

  const vouchers = [];
  for (const match of text.matchAll(/<VOUCHER\b([^>]*)>([\s\S]*?)<\/VOUCHER\s*>/gi)) {
    const attrs = match[1];
    const body = match[2];
    const rawType = attrValue(attrs, 'VCHTYPE') || tagText(body, 'VOUCHERTYPENAME');
    const type = normaliseVoucherType(rawType);
    if (!type) {
      return { ok: false, error: `Unsupported Tally voucher type "${rawType || 'unknown'}".` };
    }
    const date = isoFromTallyDate(tagText(body, 'DATE'));
    if (!date) return { ok: false, error: `Tally ${type} voucher has an invalid or missing date.` };
    const narration = tagText(body, 'NARRATION');
    const lines = [];
    for (const entry of body.matchAll(
      /<(?:ALL)?LEDGERENTRIES\.LIST\b[^>]*>([\s\S]*?)<\/(?:ALL)?LEDGERENTRIES\.LIST>/gi,
    )) {
      const entryBody = entry[1];
      const ledgerName = tagText(entryBody, 'LEDGERNAME');
      if (!ledgerName) return { ok: false, error: `Tally ${type} voucher has an entry without a ledger.` };
      const amountRaw = tagText(entryBody, 'AMOUNT').replace(/,/g, '');
      const amount = parseAmount(amountRaw);
      if (amount === null || amount === 0) {
        return { ok: false, error: `Tally ${type} voucher has an invalid amount for "${ledgerName}".` };
      }
      const deemed = tagText(entryBody, 'ISDEEMEDPOSITIVE').toLowerCase();
      const side = deemed === 'yes' ? 'Dr' : deemed === 'no' ? 'Cr' : amount < 0 ? 'Cr' : 'Dr';
      lines.push({ ledgerName, side, amount: Math.abs(amount) });
    }
    if (lines.length < 2) {
      return { ok: false, error: `Tally ${type} voucher dated ${date} needs at least two ledger entries.` };
    }

    const inventory = [];
    let inventoryError = '';
    entries: for (const entry of body.matchAll(
      /<INVENTORYENTRIES\.LIST\b[^>]*>([\s\S]*?)<\/INVENTORYENTRIES\.LIST>/gi,
    )) {
      const entryBody = entry[1];
      const itemName = tagText(entryBody, 'STOCKITEMNAME');
      if (!itemName) {
        inventoryError = `Tally ${type} voucher dated ${date} has an inventory line without a stock item.`;
        break;
      }
      const qty =
        tallyNumber(tagText(entryBody, 'ACTUALQTY'), parseQty) ??
        tallyNumber(tagText(entryBody, 'BILLEDQTY'), parseQty);
      if (qty === null || qty === 0) {
        inventoryError = `Tally stock item "${itemName}" has an invalid quantity.`;
        break;
      }
      let rate = tallyNumber(tagText(entryBody, 'RATE'), parseAmount);
      const amount = tallyNumber(tagText(entryBody, 'AMOUNT'), parseAmount);
      if (rate === null && amount !== null && qty !== 0) {
        rate = round2(Math.abs(amount) / Math.abs(qty));
      }
      if (rate === null || rate < 0) {
        inventoryError = `Tally stock item "${itemName}" has an invalid rate.`;
        break;
      }
      const entryQty = Math.abs(qty);
      const godownName = tagText(entryBody, 'GODOWNNAME');
      const batches = [
        ...entryBody.matchAll(/<BATCHALLOCATIONS\.LIST\b[^>]*>([\s\S]*?)<\/BATCHALLOCATIONS\.LIST>/gi),
      ];
      if (batches.length) {
        for (const batch of batches) {
          const batchQty = Math.abs(tallyNumber(tagText(batch[1], 'ACTUALQTY'), parseQty) ?? 0);
          if (!batchQty) {
            inventoryError = `Tally stock item "${itemName}" has a batch without a quantity.`;
            break entries;
          }
          const expiryRaw = tagText(batch[1], 'EXPIRYDATE');
          const expiryDate = expiryRaw ? isoFromTallyDate(expiryRaw) : '';
          if (expiryRaw && !expiryDate) {
            inventoryError = `Tally stock item "${itemName}" has an invalid batch expiry date.`;
            break entries;
          }
          inventory.push({
            itemName,
            qty: batchQty,
            rate,
            godownName: tagText(batch[1], 'GODOWNNAME') || godownName,
            batchNo: tagText(batch[1], 'BATCHNAME'),
            expiryDate,
          });
        }
      } else {
        inventory.push({ itemName, qty: entryQty, rate, godownName, batchNo: '', expiryDate: '' });
      }
    }

    vouchers.push({ type, date, narration, lines, inventory, inventoryError });
  }

  if (!groups.length && !ledgers.length && !vouchers.length && !stockGroups.length && !stockItems.length) {
    return {
      ok: false,
      error: 'No Tally account groups, ledgers, stock masters or vouchers were found. Export All Masters or vouchers as XML.',
    };
  }
  return { ok: true, groups, ledgers, vouchers, stockGroups, stockItems };
}

/**
 * Validates and applies a Tally XML import to a company clone first. The live
 * company is changed only after every ledger and voucher passes validation.
 */
function importTallyXml(company, xml) {
  if (!company) return { ok: false, error: 'Open a company first.' };
  const parsed = parseTallyXml(xml);
  if (!parsed.ok) return parsed;

  const clone = JSON.parse(JSON.stringify(company));
  const groupPayloads = [];
  const existingGroupNames = new Set(
    (clone.groups ?? []).map((group) => group.name.trim().toLowerCase()),
  );
  const pendingGroups = parsed.groups.slice();
  while (pendingGroups.length) {
    let progress = false;
    for (let index = 0; index < pendingGroups.length; ) {
      const group = pendingGroups[index];
      const key = group.name.trim().toLowerCase();
      if (existingGroupNames.has(key)) {
        pendingGroups.splice(index, 1);
        progress = true;
        continue;
      }
      const parentKey = group.parent.trim().toLowerCase();
      if (!parentKey) {
        return {
          ok: false,
          error: `Tally group "${group.name}" has no PARENT; top-level groups must already exist here.`,
        };
      }
      if (!existingGroupNames.has(parentKey)) {
        index += 1;
        continue;
      }
      const parent = (clone.groups ?? []).find(
        (entry) => entry.name.trim().toLowerCase() === parentKey,
      );
      const result = addGroup(clone, { name: group.name, parentId: parent?.id });
      if (!result.ok) return { ok: false, error: `Tally group "${group.name}": ${result.error}` };
      existingGroupNames.add(key);
      groupPayloads.push({ name: group.name, parentName: parent.name });
      pendingGroups.splice(index, 1);
      progress = true;
    }
    if (!progress) {
      const group = pendingGroups[0];
      return {
        ok: false,
        error: `Tally group "${group.name}" uses parent "${group.parent}", which does not exist here.`,
      };
    }
  }

  const stockGroupNames = [];
  for (const group of parsed.stockGroups) {
    const existing = (clone.stockGroups ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === group.name.trim().toLowerCase(),
    );
    if (existing) continue;
    const result = addStockGroup(clone, { name: group.name });
    if (!result.ok) return { ok: false, error: `Tally stock group "${group.name}": ${result.error}` };
    stockGroupNames.push(group.name);
  }

  const stockItemPayloads = [];
  for (const item of parsed.stockItems) {
    const group = (clone.stockGroups ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === item.parent.trim().toLowerCase(),
    );
    if (!group) {
      return {
        ok: false,
        error: `Tally stock item "${item.name}" uses stock group "${item.parent}", which does not exist here.`,
      };
    }
    const unit = (clone.units ?? []).find(
      (entry) =>
        entry.name.trim().toLowerCase() === item.unitName.trim().toLowerCase() ||
        entry.symbol.trim().toLowerCase() === item.unitName.trim().toLowerCase(),
    );
    if (!unit) {
      return {
        ok: false,
        error: `Tally stock item "${item.name}" uses unit "${item.unitName}", which does not exist here.`,
      };
    }
    const result = addStockItem(clone, {
      name: item.name,
      stockGroupId: group.id,
      unitId: unit.id,
      openingQty: item.openingQty,
      openingRate: item.openingRate,
      hsn: item.hsn,
    });
    if (!result.ok) return { ok: false, error: `Tally stock item "${item.name}": ${result.error}` };
    stockItemPayloads.push(item);
  }

  const ledgerPayloads = [];
  for (const ledger of parsed.ledgers) {
    const group = (clone.groups ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === ledger.parent.trim().toLowerCase(),
    );
    if (!group) {
      return {
        ok: false,
        error: `Tally ledger "${ledger.name}" uses group "${ledger.parent}", which does not exist here.`,
      };
    }
    const payload = {
      name: ledger.name,
      groupName: ledger.parent,
      opening: ledger.opening,
      openingType: ledger.openingType,
      ...(ledger.gstin ? { gstin: ledger.gstin } : {}),
      ...(ledger.pan ? { pan: ledger.pan } : {}),
    };
    const result = addLedger(clone, { ...payload, groupId: group.id });
    if (!result.ok) return { ok: false, error: `Tally ledger "${ledger.name}": ${result.error}` };
    ledgerPayloads.push(payload);
  }

  const resolveLines = (target, voucher) => {
    const lines = [];
    for (const line of voucher.lines ?? voucher.entries ?? []) {
      const ledger = (target.ledgers ?? []).find(
        (entry) => entry.name.trim().toLowerCase() === line.ledgerName.trim().toLowerCase(),
      );
      if (!ledger) {
        return {
          error: `Tally ${voucher.type} voucher dated ${voucher.date} uses missing ledger "${line.ledgerName}".`,
        };
      }
      lines.push({ ledgerId: ledger.id, side: line.side, amount: line.amount });
    }
    return { lines };
  };

  const voucherPayloads = [];
  const stockWarnings = [];
  let stockLines = 0;
  let stockLinesSkipped = 0;
  for (const voucher of parsed.vouchers) {
    const resolved = resolveLines(clone, voucher);
    if (resolved.error) return { ok: false, error: resolved.error };
    const stock = resolveInventory(clone, voucher);
    let items = stock.items ?? [];
    if (stock.error) {
      stockLinesSkipped += voucher.inventory?.length || 1;
      if (!stockWarnings.includes(stock.error)) stockWarnings.push(stock.error);
      items = [];
    }
    const payload = {
      type: voucher.type,
      date: voucher.date,
      narration: voucher.narration,
      entries: voucher.lines,
      inventory: voucher.inventory,
      inventoryError: voucher.inventoryError,
      ...(stock.error ? { stockSkipped: true } : {}),
    };
    let result = addVoucher(clone, { ...payload, lines: resolved.lines, items });
    if (!result.ok && items.length) {
      // Keep the accounting voucher when stock detail cannot be applied, as in
      // the pre-stock importer, but report every skipped stock line.
      if (!stockWarnings.includes(result.error)) stockWarnings.push(result.error);
      stockLinesSkipped += items.length;
      items = [];
      payload.stockSkipped = true;
      result = addVoucher(clone, { ...payload, lines: resolved.lines });
    }
    if (!result.ok) {
      return { ok: false, error: `Tally ${voucher.type} voucher dated ${voucher.date}: ${result.error}` };
    }
    if (items.length) stockLines += items.length;
    payload.items = items;
    voucherPayloads.push(payload);
  }

  for (const payload of groupPayloads) {
    const parent = (company.groups ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === payload.parentName.trim().toLowerCase(),
    );
    const result = addGroup(company, { name: payload.name, parentId: parent?.id });
    if (!result.ok) return { ok: false, error: result.error };
  }
  for (const name of stockGroupNames) {
    const result = addStockGroup(company, { name });
    if (!result.ok) return { ok: false, error: result.error };
  }
  for (const item of stockItemPayloads) {
    const group = (company.stockGroups ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === item.parent.trim().toLowerCase(),
    );
    const unit = (company.units ?? []).find(
      (entry) =>
        entry.name.trim().toLowerCase() === item.unitName.trim().toLowerCase() ||
        entry.symbol.trim().toLowerCase() === item.unitName.trim().toLowerCase(),
    );
    const result = addStockItem(company, {
      name: item.name,
      stockGroupId: group?.id,
      unitId: unit?.id,
      openingQty: item.openingQty,
      openingRate: item.openingRate,
      hsn: item.hsn,
    });
    if (!result.ok) return { ok: false, error: result.error };
  }
  for (const payload of ledgerPayloads) {
    const group = (company.groups ?? []).find(
      (entry) => entry.name.trim().toLowerCase() === payload.groupName.trim().toLowerCase(),
    );
    const result = addLedger(company, { ...payload, groupId: group?.id });
    if (!result.ok) return { ok: false, error: result.error };
  }
  for (const payload of voucherPayloads) {
    const resolved = resolveLines(company, payload);
    if (resolved.error) return { ok: false, error: resolved.error };
    const stock = payload.stockSkipped ? { items: [] } : resolveInventory(company, payload);
    if (stock.error) return { ok: false, error: stock.error };
    const result = addVoucher(company, {
      type: payload.type,
      date: payload.date,
      narration: payload.narration,
      lines: resolved.lines,
      items: stock.items,
    });
    if (!result.ok) {
      return { ok: false, error: `Tally ${payload.type} voucher dated ${payload.date}: ${result.error}` };
    }
  }
  return {
    ok: true,
    groups: groupPayloads.length,
    ledgers: ledgerPayloads.length,
    vouchers: voucherPayloads.length,
    stockGroups: stockGroupNames.length,
    stockItems: stockItemPayloads.length,
    stockLines,
    stockLinesSkipped,
    stockWarning: stockWarnings[0] ?? '',
  };
}

// ---- src/xlsx.js ----
// ZledgerCraft - minimal dependency-free XLSX reader.
// Reads the first worksheet, or a sheet named Ledgers/Vouchers, into rows of text.
// It supports stored and deflated ZIP entries, shared/inline strings, cached
// numeric/formula values and date-styled cells. It does not read formulas,
// charts, merged cells, hidden-sheet semantics or old binary .xls files.

const MAX_WORKBOOK_BYTES = 50 * 1024 * 1024;
const MAX_ENTRY_BYTES = 25 * 1024 * 1024;

const BUILTIN_DATE_FORMATS = new Set([
  14,
  15,
  16,
  17,
  22,
  ...Array.from({ length: 10 }, (_, index) => index + 27),
  ...Array.from({ length: 9 }, (_, index) => index + 50),
]);

function decodeXml(value) {
  return String(value ?? '').replace(
    /&(?:#x([0-9a-f]+)|#(\d+)|(amp|lt|gt|quot|apos));/gi,
    (match, hex, decimal, named) => {
      if (hex) return String.fromCodePoint(parseInt(hex, 16));
      if (decimal) return String.fromCodePoint(parseInt(decimal, 10));
      switch ((named || '').toLowerCase()) {
        case 'amp':
          return '&';
        case 'lt':
          return '<';
        case 'gt':
          return '>';
        case 'quot':
          return '"';
        case 'apos':
          return "'";
        default:
          return match;
      }
    },
  );
}

function attrValue(raw, name) {
  for (const match of String(raw).matchAll(/([:\w.-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g)) {
    if (match[1].toLowerCase() === name.toLowerCase()) return decodeXml(match[2] ?? match[3] ?? '');
  }
  return '';
}

function textValue(xml, tag) {
  const match = String(xml).match(new RegExp(`<${tag}\\b[^>]*>([\\s\\S]*?)</${tag}\\s*>`, 'i'));
  return match ? decodeXml(match[1]) : '';
}

function normalizeZipPath(target) {
  let path = String(target ?? '').replace(/\\/g, '/').trim();
  if (!path) return '';
  if (path.startsWith('/')) path = path.slice(1);
  else path = `xl/${path}`;
  const parts = [];
  for (const part of path.split('/')) {
    if (!part || part === '.') continue;
    if (part === '..') parts.pop();
    else parts.push(part);
  }
  return parts.join('/');
}

async function inflateRaw(bytes) {
  if (typeof DecompressionStream !== 'function') {
    throw new Error('This browser cannot decompress Excel workbooks. Use the CSV import instead.');
  }
  let stream;
  try {
    stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  } catch {
    throw new Error('This browser cannot decompress Excel workbooks. Use the CSV import instead.');
  }
  const output = await new Response(stream).arrayBuffer();
  return new Uint8Array(output);
}

/** Unpacks the small subset of ZIP needed by an XLSX workbook. */
async function unzipWorkbook(bytes) {
  if (bytes.length < 22) throw new Error('That file is not a valid .xlsx workbook.');
  if (bytes.length > MAX_WORKBOOK_BYTES) throw new Error('The workbook is larger than 50 MB.');
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  const stop = Math.max(0, bytes.length - 65557);
  for (let offset = bytes.length - 22; offset >= stop; offset -= 1) {
    if (view.getUint32(offset, true) === 0x06054b50) {
      eocd = offset;
      break;
    }
  }
  if (eocd < 0) throw new Error('That file is not a valid .xlsx workbook.');
  if (view.getUint16(eocd + 4, true) !== 0 || view.getUint16(eocd + 6, true) !== 0) {
    throw new Error('Multi-volume Excel workbooks are not supported.');
  }
  const count = view.getUint16(eocd + 10, true);
  const centralOffset = view.getUint32(eocd + 16, true);
  if (count === 0xffff || centralOffset === 0xffffffff) {
    throw new Error('ZIP64 Excel workbooks are not supported. Re-save the file as a standard .xlsx.');
  }

  const decoder = new TextDecoder();
  const files = new Map();
  let offset = centralOffset;
  let total = 0;
  for (let index = 0; index < count; index += 1) {
    if (offset + 46 > bytes.length || view.getUint32(offset, true) !== 0x02014b50) {
      throw new Error('The workbook ZIP directory is damaged.');
    }
    const flags = view.getUint16(offset + 8, true);
    const method = view.getUint16(offset + 10, true);
    const compressedSize = view.getUint32(offset + 20, true);
    const uncompressedSize = view.getUint32(offset + 24, true);
    const nameLength = view.getUint16(offset + 28, true);
    const extraLength = view.getUint16(offset + 30, true);
    const commentLength = view.getUint16(offset + 32, true);
    const localOffset = view.getUint32(offset + 42, true);
    if (offset + 46 + nameLength + extraLength + commentLength > bytes.length) {
      throw new Error('The workbook ZIP directory is damaged.');
    }
    const name = decoder.decode(bytes.subarray(offset + 46, offset + 46 + nameLength));
    offset += 46 + nameLength + extraLength + commentLength;
    if (name.endsWith('/')) continue;
    if (flags & 0x1) throw new Error('Password-protected Excel workbooks are not supported.');
    if (method !== 0 && method !== 8) {
      throw new Error(`The workbook uses an unsupported ZIP compression method for ${name}.`);
    }
    if (compressedSize > MAX_ENTRY_BYTES || uncompressedSize > MAX_ENTRY_BYTES) {
      throw new Error('A workbook entry is larger than the 25 MB import limit.');
    }
    if (localOffset + 30 > bytes.length || view.getUint32(localOffset, true) !== 0x04034b50) {
      throw new Error('The workbook ZIP entry is damaged.');
    }
    const localNameLength = view.getUint16(localOffset + 26, true);
    const localExtraLength = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + localNameLength + localExtraLength;
    if (dataStart + compressedSize > bytes.length) {
      throw new Error('The workbook ZIP entry is truncated.');
    }
    const compressed = bytes.subarray(dataStart, dataStart + compressedSize);
    const data = method === 0 ? compressed : await inflateRaw(compressed);
    total += data.length;
    if (total > MAX_WORKBOOK_BYTES) throw new Error('The unpacked workbook is larger than 50 MB.');
    files.set(name, data);
  }
  return files;
}

function readSharedStrings(xml) {
  if (!xml) return [];
  const strings = [];
  for (const match of String(xml).matchAll(/<si\b[^>]*>([\s\S]*?)<\/si\s*>/gi)) {
    const parts = [];
    for (const text of match[1].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t\s*>/gi)) {
      parts.push(decodeXml(text[1]));
    }
    strings.push(parts.join(''));
  }
  return strings;
}

function isDateFormat(code) {
  const cleaned = String(code ?? '')
    .replace(/"[^"]*"/g, '')
    .replace(/\[[^\]]*\]/g, '')
    .replace(/\\./g, '');
  return /[ymd]/i.test(cleaned);
}

function readStyles(xml) {
  const dateStyles = new Set();
  if (!xml) return dateStyles;
  const customDates = new Set();
  for (const match of String(xml).matchAll(/<numFmt\b([^>]*)\/?>/gi)) {
    if (isDateFormat(attrValue(match[1], 'formatCode'))) {
      customDates.add(attrValue(match[1], 'numFmtId'));
    }
  }
  const cellXfs = String(xml).match(/<cellXfs\b[^>]*>([\s\S]*?)<\/cellXfs\s*>/i);
  if (!cellXfs) return dateStyles;
  let index = 0;
  for (const match of cellXfs[1].matchAll(/<xf\b([^>]*)\/?>/gi)) {
    const formatId = attrValue(match[1], 'numFmtId');
    if (BUILTIN_DATE_FORMATS.has(Number(formatId)) || customDates.has(formatId)) {
      dateStyles.add(index);
    }
    index += 1;
  }
  return dateStyles;
}

function columnIndex(reference) {
  const letters = String(reference ?? '').match(/^[A-Z]+/i)?.[0];
  if (!letters) return 0;
  let value = 0;
  for (const letter of letters.toUpperCase()) value = value * 26 + (letter.charCodeAt(0) - 64);
  return Math.max(0, value - 1);
}

function excelDate(serial) {
  const value = Number(serial);
  if (!Number.isFinite(value) || value < 1 || value > 2958465) return null;
  const date = new Date(Date.UTC(1899, 11, 30) + Math.floor(value) * 86400000);
  return Number.isNaN(date.getTime()) ? null : date.toISOString().slice(0, 10);
}

function readCell(attrs, body, sharedStrings, dateStyles) {
  const type = attrValue(attrs, 't');
  let value = textValue(body, 'v');
  if (type === 'inlineStr') {
    const inline = body.match(/<is\b[^>]*>([\s\S]*?)<\/is\s*>/i);
    if (!inline) return '';
    return [...inline[1].matchAll(/<t\b[^>]*>([\s\S]*?)<\/t\s*>/gi)]
      .map((entry) => decodeXml(entry[1]))
      .join('');
  }
  if (type === 's') {
    const index = Number(value);
    return Number.isInteger(index) && index >= 0 ? sharedStrings[index] ?? '' : '';
  }
  if (type === 'b') return value === '1' ? 'TRUE' : value === '0' ? 'FALSE' : value;
  if (type === 'e' || type === 'str' || type === 'd') return value;
  if (value === '') return '';
  const style = Number(attrValue(attrs, 's'));
  if (dateStyles.has(style)) {
    const date = excelDate(value);
    if (date) return date;
  }
  return value;
}

function readSheet(xml, sharedStrings, dateStyles) {
  const rows = [];
  for (const row of String(xml).matchAll(/<row\b[^>]*>([\s\S]*?)<\/row\s*>/gi)) {
    const cells = [];
    let nextColumn = 0;
    for (const cell of row[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c\s*>)/gi)) {
      const reference = attrValue(cell[1], 'r');
      const column = reference ? columnIndex(reference) : nextColumn;
      nextColumn = column + 1;
      cells[column] = readCell(cell[1], cell[2] ?? '', sharedStrings, dateStyles);
    }
    while (cells.length && String(cells[cells.length - 1] ?? '').trim() === '') cells.pop();
    if (cells.some((cell) => String(cell ?? '').trim() !== '')) rows.push(cells);
  }
  return rows;
}

function readSheets(workbookXml, relationshipsXml, files) {
  const relationships = new Map();
  for (const match of String(relationshipsXml ?? '').matchAll(/<Relationship\b([^>]*)\/?>/gi)) {
    const id = attrValue(match[1], 'Id');
    const target = attrValue(match[1], 'Target');
    if (id && target) relationships.set(id, normalizeZipPath(target));
  }
  const sheets = [];
  for (const match of String(workbookXml).matchAll(/<sheet\b([^>]*)\/?>/gi)) {
    const name = attrValue(match[1], 'name') || `Sheet ${sheets.length + 1}`;
    const relationId = attrValue(match[1], 'r:id') || attrValue(match[1], 'id');
    let path = '';
    if (relationId && relationships.has(relationId)) {
      path = relationships.get(relationId);
      // Chart sheets and external targets have no worksheet XML file.
      if (!path || !files.has(path)) continue;
    } else {
      const fallback = `xl/worksheets/sheet${sheets.length + 1}.xml`;
      if (!files.has(fallback)) continue;
      path = fallback;
    }
    sheets.push({ name, path });
  }
  return sheets;
}

/**
 * Reads an .xlsx ArrayBuffer into `{ sheets: [{ name, rows }] }`.
 * Throws a user-facing Error for damaged, encrypted or unsupported workbooks.
 */
async function parseXlsxWorkbook(buffer) {
  const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
  const files = await unzipWorkbook(bytes);
  const decoder = new TextDecoder();
  const workbookXml = files.get('xl/workbook.xml');
  if (!workbookXml) throw new Error('That workbook has no xl/workbook.xml and cannot be read.');
  const workbookText = decoder.decode(workbookXml);
  const relationships = files.get('xl/_rels/workbook.xml.rels');
  const sheets = readSheets(workbookText, relationships ? decoder.decode(relationships) : '', files);
  if (!sheets.length) throw new Error('The workbook has no readable worksheets.');
  const sharedStrings = readSharedStrings(
    files.has('xl/sharedStrings.xml') ? decoder.decode(files.get('xl/sharedStrings.xml')) : '',
  );
  const dateStyles = readStyles(files.has('xl/styles.xml') ? decoder.decode(files.get('xl/styles.xml')) : '');
  const parsed = [];
  for (const sheet of sheets) {
    const xml = decoder.decode(files.get(sheet.path));
    parsed.push({ name: sheet.name, rows: readSheet(xml, sharedStrings, dateStyles) });
  }
  return { sheets: parsed };
}

/** Find a preferred sheet by exact name, then prefix, then the first sheet. */
function pickSheet(workbook, preferredName) {
  const sheets = workbook?.sheets ?? [];
  if (!sheets.length) return null;
  const target = String(preferredName ?? '').trim().toLowerCase();
  if (target) {
    const exact = sheets.find((sheet) => sheet.name.toLowerCase() === target);
    if (exact) return exact;
    const prefix = sheets.find((sheet) => sheet.name.toLowerCase().startsWith(target));
    if (prefix) return prefix;
  }
  return sheets[0];
}

/** Converts worksheet rows to the CSV text accepted by the existing importers. */
function rowsToCsv(rows) {
  return (rows ?? [])
    .map((row) =>
      row
        .map((cell) => {
          const text = String(cell ?? '');
          return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
        })
        .join(','),
    )
    .join('\n');
}

/** Read an .xlsx file into reviewed CSV text for one of the existing importers. */
async function xlsxToCsv(buffer, preferredName) {
  const workbook = await parseXlsxWorkbook(buffer);
  const sheet = pickSheet(workbook, preferredName);
  if (!sheet) throw new Error('The workbook has no readable worksheets.');
  return {
    csv: rowsToCsv(sheet.rows),
    sheetName: sheet.name,
    rows: Math.max(0, sheet.rows.length - 1),
  };
}

function workspaceRequested() {

  try {
    return (
      new URLSearchParams(location.search).get('workspace') === '1' ||
      localStorage.getItem(WORKSPACE_KEY) === 'server'
    );
  } catch {
    return false;
  }
}

function queueWorkspaceSave() {
  if (!workspaceMode) return workspaceQueue;
  const snapshot = JSON.parse(exportState(state));
  workspaceQueue = workspaceQueue
    .catch(() => {})
    .then(async () => {
      if (workspaceRemote?.conflict) return;
      const baseRev = workspaceRev;
      const response = await fetch('/api/workspace', {
        method: 'PUT',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ state: snapshot, baseRev }),
      });
      let payload = {};
      try {
        payload = await response.json();
      } catch {
        // Keep the status-based error below.
      }
      if (response.status === 409) {
        workspaceRemote = {
          rev: Number(payload.rev) || workspaceRev,
          updatedAt: payload.updatedAt ?? null,
          conflict: true,
        };
        const error = new Error(payload.error || 'The server workspace changed.');
        error.conflict = true;
        throw error;
      }
      if (!response.ok || payload.ok === false) {
        throw new Error(payload.error || `Server workspace returned ${response.status}.`);
      }
      workspaceRev = Number(payload.rev) || baseRev + 1;
      workspaceUpdatedAt = payload.updatedAt ?? workspaceUpdatedAt;
      workspaceStorage = payload.storage ?? workspaceStorage;
      workspaceRemote = null;
      refreshWorkspaceBanner();
    })
    .catch((error) => {
      if (error.conflict) {
        refreshWorkspaceBanner();
        return;
      }
      workspaceMode = false;
      stopWorkspaceWatch();
      try {
        localStorage.removeItem(WORKSPACE_KEY);
      } catch {
        // Browser storage may be unavailable.
      }
      setFlash('Server workspace save failed. This browser is using local storage again.', 'warn');
      render();
    });
  return workspaceQueue;
}

function persist() {
  saveState(state);
  maybeAutoSnapshot();
  if (workspaceMode) queueWorkspaceSave();
}

function workspaceBannerHtml() {
  if (!workspaceMode || !workspaceRemote) return '';
  const when = workspaceRemote.updatedAt
    ? new Date(workspaceRemote.updatedAt).toLocaleString('en-IN')
    : 'an unknown time';
  const action = can('data.restore')
    ? '<button class="btn small" type="button" data-action="reload-workspace">Reload server copy</button>'
    : '';
  return workspaceRemote.conflict
    ? `<div class="role-banner warn" role="status">Server workspace changed at ${esc(when)} (revision ${workspaceRemote.rev}). The last change was kept in this browser but was not saved to the server. ${action}</div>`
    : `<div class="role-banner" role="status">A newer server workspace is available, saved ${esc(when)} (revision ${workspaceRemote.rev}). ${action}</div>`;
}

function refreshWorkspaceBanner() {
  const holder = document.getElementById('workspace-banner');
  if (holder) holder.innerHTML = workspaceBannerHtml();
}

function stopWorkspaceWatch() {
  if (workspaceWatchTimer) clearInterval(workspaceWatchTimer);
  workspaceWatchTimer = null;
}

async function checkWorkspaceMeta() {
  if (!workspaceMode || workspaceRemote?.conflict || document.hidden) return;
  try {
    const response = await fetch('/api/workspace?meta=1', { cache: 'no-store' });
    const payload = await response.json();
    if (!response.ok || !payload.ok) return;
    if (Number(payload.rev) > workspaceRev) {
      workspaceRemote = {
        rev: Number(payload.rev),
        updatedAt: payload.updatedAt ?? null,
        conflict: false,
      };
      refreshWorkspaceBanner();
    }
  } catch {
    // The next poll or save reports a persistent connection problem.
  }
}

function startWorkspaceWatch() {
  if (workspaceWatchTimer || !workspaceMode) return;
  workspaceWatchTimer = setInterval(checkWorkspaceMeta, 8000);
  setTimeout(checkWorkspaceMeta, 1000);
}

async function loadServerWorkspace() {
  if (!workspaceRequested()) return null;
  workspaceMode = true;
  try {
    const response = await fetch('/api/workspace', { cache: 'no-store' });
    const payload = await response.json();
    if (!response.ok || !payload.ok) throw new Error(payload.error || 'Workspace unavailable.');
    workspaceRev = Number(payload.rev) || 0;
    workspaceUpdatedAt = payload.updatedAt ?? null;
    workspaceStorage = payload.storage ?? null;
    workspaceRemote = null;
    localStorage.setItem(WORKSPACE_KEY, 'server');
    startWorkspaceWatch();
    if (payload.state) {
      const imported = importState(JSON.stringify(payload.state));
      if (!imported.ok) throw new Error(imported.error);
      return imported.state;
    }
    return null;
  } catch {
    workspaceMode = false;
    stopWorkspaceWatch();
    try {
      localStorage.removeItem(WORKSPACE_KEY);
    } catch {
      // Ignore storage failures.
    }
    return null;
  }
}

function logAudit(action, summary, active = company(), entity = '', actor = currentProfile()) {
  recordAudit(state, {
    action,
    summary,
    entity,
    companyId: active?.id ?? '',
    companyName: active?.name ?? '',
    actorId: actor?.id ?? '',
    actorName: actor?.name ?? '',
    actorRole: actor?.role ?? '',
  });
}

function mergeAuditEntries(current, incoming) {
  const seen = new Set();
  return [...normalizeAudit(current), ...normalizeAudit(incoming)]
    .filter((entry) => {
      if (seen.has(entry.id)) return false;
      seen.add(entry.id);
      return true;
    })
    .sort((a, b) => a.at.localeCompare(b.at));
}

/** Restores data while preserving the current log and recording the restore. */
function applyRestoredState(nextState, summary) {
  const previousAudit = state.audit;
  const previousUsers = state.users ?? [];
  const previousUserId = state.currentUserId;
  const actor = currentProfile();
  nextState.audit = mergeAuditEntries(previousAudit, nextState.audit);
  const knownUsers = new Set(previousUsers.map((user) => user.id));
  nextState.users = [
    ...previousUsers,
    ...(nextState.users ?? []).filter((user) => !knownUsers.has(user.id)),
  ];
  if (nextState.users.some((user) => user.id === previousUserId)) {
    nextState.currentUserId = previousUserId;
  }
  state = nextState;
  const active = activeCompany(state);
  logAudit('data.restore', summary, active, '', actor);
  persist();
}

function groupSelectOptions(selectedId) {
  const active = company();
  if (!active) return '';
  const byPrimary = new Map();
  for (const group of active.groups) {
    const primary = active.groups.find((item) => item.id === group.parentId) ?? group;
    const root = active.groups.find((item) => item.id === primary.parentId) ?? primary;
    if (!byPrimary.has(root.id)) byPrimary.set(root.id, []);
    byPrimary.get(root.id).push(group);
  }
  let html = '';
  for (const [rootId, groups] of byPrimary) {
    const root = active.groups.find((group) => group.id === rootId);
    html += `<optgroup label="${esc(root.name)} · ${esc(root.nature)}">`;
    for (const group of groups) {
      const selected = group.id === selectedId ? ' selected' : '';
      const depth = group.parentId ? '— ' : '';
      html += `<option value="${esc(group.id)}"${selected}>${depth}${esc(group.name)}</option>`;
    }
    html += '</optgroup>';
  }
  return html;
}

function groupParentOptions(selectedId = '', excludeId = null) {
  const active = company();
  if (!active) return '';
  const depthOf = (group) => {
    let depth = 0;
    let cursor = group;
    while (cursor && cursor.parentId && depth < 8) {
      cursor = active.groups.find((item) => item.id === cursor.parentId);
      depth += 1;
    }
    return depth;
  };

  let html = '';
  for (const root of active.groups.filter((group) => !group.parentId)) {
    const options = active.groups.filter(
      (group) => group.id !== excludeId && primaryKeyOf(active, group.id) === root.key,
    );
    if (options.length === 0) continue;
    html += `<optgroup label="${esc(root.name)} · ${esc(root.nature)}">`;
    for (const group of options) {
      const selected = group.id === selectedId ? ' selected' : '';
      html += `<option value="${esc(group.id)}"${selected}>${'— '.repeat(depthOf(group))}${esc(group.name)}</option>`;
    }
    html += '</optgroup>';
  }
  return html;
}

function prepareDraft(type, source = null) {
  const active = company();
  if (!active) return null;
  const today = todayIso();
  const openToday = (active.years ?? []).some(
    (year) => !year.closed && today >= year.start && today <= year.end,
  );
  draft = {
    type: source?.type ?? type,
    date: source?.date ?? (openToday ? today : active.fyStart),
    narration: source?.narration ?? '',
    bill: {
      ref: source?.bill?.ref ?? '',
      dueDate: source?.bill?.dueDate ?? '',
    },
    instrument: {
      kind: source?.instrument?.kind ?? '',
      number: source?.instrument?.number ?? '',
      date: source?.instrument?.date ?? '',
      bankLedgerId: source?.instrument?.bankLedgerId ?? '',
    },
    gst: {
      rateId: source?.gst?.rateId ?? '',
      partyGstin: source?.gst?.partyGstin ?? '',
      placeOfSupply: source?.gst?.placeOfSupply ?? '',
      reverseCharge: Boolean(source?.gst?.reverseCharge),
    },
    tds: {
      sectionId: source?.tds?.sectionId ?? '',
      pan: source?.tds?.pan ?? '',
    },
    currencyCode: source?.currencyCode ?? 'INR',
    exchangeRate: source?.exchangeRate != null ? String(source.exchangeRate) : '',
    lines: source
      ? source.lines.map((line) => ({
          ...line,
          amount: line.currencyAmount ?? line.amount,
          allocations: (line.allocations ?? []).map((allocation) => ({ ...allocation })),
        }))
      : voucherFormLines(type),
    items: source?.items ? source.items.map((line) => ({ ...line })) : [],
  };
  inlineLedger = null;
  return draft;
}

  prepareDraft(voucher.type, { ...voucher, date: withinFy ? today : active.fyStart });
  navigate('voucherNew', { type: voucher.type });
  setFlash('Copied — review the details and accept.', 'ok');

function orderToVoucher(orderId) {
  const active = company();
  if (!active || !requirePermission('voucher.write')) return;
  const order = (active.orders ?? []).find((entry) => entry.id === orderId);
  if (!order) {
    setFlash('Order not found.', 'warn');
    return;
  }
  const type = order.type === 'Sales' ? 'Sales' : 'Purchase';
  const party = (active.ledgers ?? []).find((ledger) => ledger.id === order.partyLedgerId);
  const controlId = suggestedLedger(type === 'Sales' ? 'sales' : 'purchase');
  if (!party || !controlId) {
    setFlash(`Add a ${type === 'Sales' ? 'Sales' : 'Purchases'} ledger before converting this order.`, 'warn');
    return;
  }
  prepareDraft(type);
  draft.date = order.date;
  draft.lines = type === 'Sales'
    ? [
        { ledgerId: party.id, side: 'Dr', amount: order.total },
        { ledgerId: controlId, side: 'Cr', amount: order.total },
      ]
    : [
        { ledgerId: controlId, side: 'Dr', amount: order.total },
        { ledgerId: party.id, side: 'Cr', amount: order.total },
      ];
  draft.items = order.items.map((line) => ({ ...line }));
  draft.narration = `Against ${order.type === 'Sales' ? 'SO' : 'PO'}-${order.no}${order.narration ? ` · ${order.narration}` : ''}`;
  navigate('voucherNew', { type });
  setFlash(`Prefilled a ${type.toLowerCase()} voucher from ${order.type === 'Sales' ? 'SO' : 'PO'}-${order.no}. Review and accept it.`);
}

  return [...form.querySelectorAll('tr.line')].map((row, index) => {
    const line = {

      side: row.querySelector('select.side').value,

      costCentreId: row.querySelector('select.cost-centre')?.value ?? '',

    if (allocationsByLine.has(index)) line.allocations = allocationsByLine.get(index);

  });

  draft.currencyCode = form.querySelector('[name="currencyCode"]')?.value ?? 'INR';
  draft.exchangeRate = form.querySelector('[name="exchangeRate"]')?.value ?? '';

  draft.instrument = formInstrument(form);
  draft.gst = formGst(form) ?? draft.gst;
  draft.tds = formTds(form) ?? draft.tds;

function itemLineAmount(line) {
  const qty = parseQty(line.qty) ?? 0;
  const rate = parseAmount(line.rate) ?? 0;
  return round2(qty * rate);
}

function gstTaxableValue(form, active) {
  if (!draft || !GST_TAXABLE_SIDE[draft.type]) return null;
  if (!form.querySelector('[name="gstRate"]')?.value) return null;
  const side = GST_TAXABLE_SIDE[draft.type];
  const taxLedgerIds = new Set(Object.values(gstTaxLedgers(active)).map((ledger) => ledger.id));
  let taxable = 0;
  for (const row of form.querySelectorAll('tr.line')) {
    if (row.querySelector('select.side').value !== side) continue;
    if (taxLedgerIds.has(ledgerIdByName(row.querySelector('input.ledger').value))) continue;
    taxable = round2(taxable + (parseAmount(row.querySelector('input.amount').value) ?? 0));
  }
  return taxable;
}

function tdsBaseValue(form) {
  if (!draft || !['Purchase', 'Sales'].includes(draft.type)) return null;
  if (!form.querySelector('[name="tdsSection"]')?.value) return null;
  const side = draft.type === 'Purchase' ? 'Dr' : 'Cr';
  let base = 0;
  for (const row of form.querySelectorAll('tr.line')) {
    if (row.querySelector('select.side').value !== side) continue;
    base = round2(base + (parseAmount(row.querySelector('input.amount').value) ?? 0));
  }
  return base;
}

function updateVoucherTotals() {
  const form = document.getElementById('voucher-form');
  const target = document.getElementById('voucher-totals');
  if (!form || !target) return;
  const active = company();
  const currencyCode = form.querySelector('[name="currencyCode"]')?.value || 'INR';
  const foreign = currencyCode !== 'INR';
  const rate = foreign ? parseAmount(form.querySelector('[name="exchangeRate"]')?.value) ?? 0 : 1;
  let foreignDebit = 0;
  let foreignCredit = 0;
  let debit = 0;
  let credit = 0;
  for (const row of form.querySelectorAll('tr.line')) {
    const amount = parseAmount(row.querySelector('input.amount').value) ?? 0;
    const base = round2(amount * rate);
    if (row.querySelector('select.side').value === 'Cr') {
      foreignCredit += amount;
      credit += base;
    } else {
      foreignDebit += amount;
      debit += base;
    }
  }
  foreignDebit = round2(foreignDebit);
  foreignCredit = round2(foreignCredit);
  debit = round2(debit);
  credit = round2(credit);
  const difference = round2(debit - credit);
  const foreignDifference = round2(foreignDebit - foreignCredit);
  const currency = (active?.currencies ?? []).find((item) => item.code === currencyCode);
  const foreignMoney = (value) => `${esc(currencyCode)} ${round2(value).toFixed(2)}`;

  for (const allocationRow of form.querySelectorAll('tr.bill-allocation')) {
    const lineRow = form.querySelectorAll('tr.line')[Number(allocationRow.dataset.line)];
    const target = allocationRow.querySelector('.party-amount');
    if (!lineRow || !target) continue;
    target.textContent = `${lineRow.querySelector('select.side').value} ${money(
      parseAmount(lineRow.querySelector('input.amount').value) ?? 0,
    )}`;
  }

  const itemTable = document.getElementById('stock-items');
  let itemTotal = null;
  if (itemTable) {
    itemTotal = 0;
    for (const row of itemTable.querySelectorAll('tr.item-line')) {
      const qty = parseQty(row.querySelector('input.qty').value) ?? 0;
      const rate = parseAmount(row.querySelector('input.rate').value) ?? 0;
      const amount = round2(qty * rate);
      row.querySelector('.item-amount').textContent = money(amount);
      itemTotal = round2(itemTotal + amount);
    }
    const gstBase = gstTaxableValue(form, active);
    const tdsBase = gstBase === null ? tdsBaseValue(form) : null;
    const compareBase = gstBase ?? tdsBase;
    const compareLabel = gstBase !== null ? 'GST taxable value' : tdsBase !== null ? 'TDS/TCS base' : 'voucher total';
    const itemGap = round2((compareBase ?? debit) - itemTotal);
    const note = document.getElementById('item-total-note');
    if (note) {
      note.textContent = !itemTotal
        ? ''
        : Math.abs(itemGap) < 0.01
          ? `Stock items match the ${compareLabel}.`
          : `Stock items are ${money(Math.abs(itemGap))} ${itemGap > 0 ? 'below' : 'above'} the ${compareLabel}.`;
      note.className = Math.abs(itemGap) < 0.01 ? 'muted ok-text' : 'muted off-text';
    }
  }

  const gstTarget = document.getElementById('gst-summary');
  if (gstTarget) {
    const rateId = form.querySelector('[name="gstRate"]')?.value ?? '';
    const rate = (active?.gst?.rates ?? []).find((entry) => entry.id === rateId);
    if (!rate) {
      gstTarget.innerHTML = '<span class="muted">No GST on this voucher.</span>';
    } else {
      const taxable = gstTaxableValue(form, active) ?? 0;
      const placeOfSupply = form.querySelector('[name="gstPlaceOfSupply"]')?.value || active.gst.stateCode;
      const intra = placeOfSupply === active.gst.stateCode;
      const tax = round2((taxable * rate.rate) / 100);
      const half = round2(tax / 2);
      const cgst = intra ? half : 0;
      const sgst = intra ? round2(tax - half) : 0;
      const igst = intra ? 0 : tax;
      const cess = round2((taxable * (rate.cess ?? 0)) / 100);
      const gross = round2(taxable + cgst + sgst + igst + cess);
      gstTarget.innerHTML = `
        <span>Taxable <strong>${money(taxable)}</strong></span>
        <span>${intra ? 'CGST' : 'IGST'} <strong>${money(intra ? cgst : igst)}</strong></span>
        ${intra ? `<span>SGST <strong>${money(sgst)}</strong></span>` : ''}
        ${cess ? `<span>Cess <strong>${money(cess)}</strong></span>` : ''}
        <span>Tax <strong>${money(round2(cgst + sgst + igst + cess))}</strong></span>
        <span class="gst-total">Party/cash line will be <strong>${money(gross)}</strong></span>`;
    }
  }

  const tdsTarget = document.getElementById('tds-summary');
  if (tdsTarget) {
    const sectionId = form.querySelector('[name="tdsSection"]')?.value ?? '';
    const section = (active?.tds?.sections ?? []).find((entry) => entry.id === sectionId);
    if (!section) {
      tdsTarget.innerHTML = '<span class="muted">No TDS/TCS on this voucher.</span>';
    } else {
      const base = tdsBaseValue(form) ?? 0;
      const amount = round2((base * section.rate) / 100);
      const partyTotal = section.kind === 'TDS' ? round2(base - amount) : round2(base + amount);
      tdsTarget.innerHTML = `
        <span>Base <strong>${money(base)}</strong></span>
        <span>${esc(section.code)} <strong>${section.rate}%</strong></span>
        <span>${section.kind} <strong>${money(amount)}</strong></span>
        <span class="gst-total">Party/cash line will be <strong>${money(partyTotal)}</strong></span>`;
    }
  }

  target.innerHTML = foreign
    ? `
    <span>Debit <strong>${foreignMoney(foreignDebit)}</strong></span>
    <span>Credit <strong>${foreignMoney(foreignCredit)}</strong></span>
    <span class="${Math.abs(foreignDifference) < 0.01 ? 'flat' : 'off'}">Difference <strong>${foreignMoney(foreignDifference)}</strong></span>
    <span class="currency-note">At ${esc(currency?.symbol ?? currencyCode)} 1 = ${money(rate)} · base Dr ${money(debit)} / Cr ${money(credit)}</span>`
    : `
    <span>Debit <strong>${money(debit)}</strong></span>
    <span>Credit <strong>${money(credit)}</strong></span>
    <span class="${Math.abs(difference) < 0.01 ? 'flat' : 'off'}">Difference <strong>${money(difference)}</strong></span>
    ${itemTotal === null ? '' : `<span class="${Math.abs(round2((gstTaxableValue(form, active) ?? tdsBaseValue(form) ?? debit) - itemTotal)) < 0.01 ? 'flat' : 'off'}">Items <strong>${money(itemTotal)}</strong></span>`}`;
}

    return `${years.length} year${years.length === 1 ? '' : 's'} · ${dateLabel(years[0].start)} to ${dateLabel(years[years.length - 1].end)}`;

  if (view.screen === 'audit') {

  }
  if (view.screen === 'daybook') return span(filters.daybook.from, filters.daybook.to);

  if (view.screen === 'registers') return span(filters.register.from, filters.register.to);

  if (view.screen === 'orders') {

  }
  if (view.screen === 'cashBank') return span(filters.cashBook.from, filters.cashBook.to);
  if (view.screen === 'postDated') {
    return `${span(filters.postDated.from, filters.postDated.to)} · as on ${dateLabel(filters.postDated.asOn || todayIso())}`;
  }
  if (view.screen === 'costCentres' || view.screen === 'costCentreDetail') {
    return span(filters.costCentres.from, filters.costCentres.to);
  }
  if (view.screen === 'forex') {

  if (view.screen === 'einvoice') return span(filters.einvoice.from, filters.einvoice.to);
  if (view.screen === 'ewaybill') {
    return `${span(filters.ewaybill.from, filters.ewaybill.to)} · threshold ${money(Number(filters.ewaybill.threshold) || 50000)}`;
  }
  if (view.screen === 'taxAudit') return span(filters.taxAudit.from, filters.taxAudit.to);
  if (view.screen === 'tds') {
    return `${filters.tds.kind === 'TCS' ? 'TCS' : 'TDS'} · ${span(filters.tds.from, filters.tds.to)}`;
  }
  if (view.screen === 'payrollRegister') {
    return span(filters.payroll.from, filters.payroll.to);
  }
  if (view.screen === 'payslip') {
    const run = (active.payroll?.runs ?? []).find((item) => item.id === view.runId);
    return run ? payrollMonthLabel(run.month) : 'Payroll';
  }
  if (view.screen === 'budgets') {
    const year =
      (active.years ?? []).find((item) => item.id === filters.budget.yearId) ??
      (active.years ?? []).find((item) => item.id === active.yearId);
    const range = year ? `${dateLabel(year.start)} to ${dateLabel(year.end)}` : `${fromDefault} to ${toDefault}`;
    return `${range} · as on ${dateLabel(filters.budget.asOn || todayIso())}`;
  }
  if (view.screen === 'outstanding') {
    return `As on ${dateLabel(filters.outstanding.asOn || active.fyEnd)}`;
  }
  if (view.screen === 'billRegister') {
    const to = filters.billRegister.to || active.fyEnd;
    return `${span(filters.billRegister.from, to)} · status as on ${dateLabel(to)}`;
  }
  if (view.screen === 'partyStatement') {
    const ledger = active.ledgers.find((item) => item.id === (filters.partyStatement.ledgerId || view.id));
    return `${ledger ? `${ledger.name} · ` : ''}${span(filters.partyStatement.from, filters.partyStatement.to)}`;
  }
  if (['trial', 'balanceSheet', 'groupSummary', 'ratios', 'statistics'].includes(view.screen)) {
    return `As on ${dateLabel(filters.period.to || active.fyEnd)}`;
  }
  if (filters.period.from || filters.period.to) return span(filters.period.from, filters.period.to);
  return `${fromDefault} to ${toDefault}`;
}

function settlementContentHtml(active) {
  if (!draft || !active) return '';
  if (draft.type === 'Sales' || draft.type === 'Purchase') return '';
  if (draft.currencyCode && draft.currencyCode !== 'INR') return '';
  const partyLines = draft.lines
    .map((line, index) => ({ line, index }))
    .filter(({ line }) => line.ledgerId && isPartyLedger(active, line.ledgerId));
  if (!partyLines.length) return '';
  return `<div class="bill-block">
    <div class="inventory-head">
      <h2>Bill-wise settlement</h2>
      <span class="muted">Optional. Unallocated money settles the oldest bill, or becomes an advance.</span>
    </div>
    <table class="lines-table bill-table">
      <thead><tr><th>Party line</th><th>Against bill</th><th class="num">Settle amount</th></tr></thead>
      <tbody>${partyLines
        .map(({ line, index }) => {
          const ledger = active.ledgers.find((item) => item.id === line.ledgerId);
          const open = partyOpenBills(active, line.ledgerId, {
            asOn: draft.date,
            excludeVoucherId: view.editId,
          });
          const existing = (line.allocations ?? [])[0];
          const options = open
            .map(
              (bill) => `<option value="${esc(bill.voucherId)}"${existing?.voucherId === bill.voucherId ? ' selected' : ''}>${esc(bill.ref)} · ${esc(dateLabel(bill.date))} · ${money(bill.remaining)} left</option>`,
            )
            .join('');
          return `<tr class="bill-allocation" data-line="${index}">
            <td><strong>${esc(ledger?.name ?? 'Party')}</strong>
              <div class="muted"><span class="party-amount">${line.side} ${money(parseAmount(line.amount) ?? 0)}</span>${open.length === 0 ? ' · no open bills' : ''}</div></td>
            <td><select class="alloc-bill" aria-label="Bill to settle for ${esc(ledger?.name ?? 'party')}">
              <option value="">On account / advance</option>${options}
            </select></td>
            <td class="num"><input class="alloc-amount" inputmode="decimal" placeholder="0.00"
              aria-label="Settlement amount" value="${esc(existing?.amount ?? '')}"></td>
          </tr>`;
        })
        .join('')}</tbody>
    </table>
  </div>`;
}

function applyPartyGstDefaults() {
  const active = company();
  const form = document.getElementById('voucher-form');
  if (!active || !form || !draft?.gst) return;
  const side = GST_TAXABLE_SIDE[draft.type];
  if (!side) return;
  const partyRow = [...form.querySelectorAll('tr.line')].find(
    (row) => row.querySelector('select.side').value !== side,
  );
  if (!partyRow) return;
  const ledger = active.ledgers.find(
    (entry) => entry.id === ledgerIdByName(partyRow.querySelector('input.ledger').value),
  );
  if (!ledger) return;
  const gstin = form.querySelector('[name="gstPartyGstin"]');
  if (gstin && !gstin.value.trim() && ledger.gstin) gstin.value = ledger.gstin;
  const placeOfSupply = form.querySelector('[name="gstPlaceOfSupply"]');
  if (placeOfSupply && !placeOfSupply.value && ledger.stateCode) placeOfSupply.value = ledger.stateCode;
  const pan = form.querySelector('[name="tdsPan"]');
  if (pan && !pan.value.trim() && ledger.pan) pan.value = ledger.pan;
}

function refreshSettlement() {
  const container = document.getElementById('bill-settlement');
  if (!container) return;
  applyPartyGstDefaults();
  captureDraft();
  container.innerHTML = settlementContentHtml(company());
  updateVoucherTotals();
}

              <button type="button" class="btn small" data-action="add-item">+ Add item</button>
              <span id="item-total-note" class="muted"></span>
            </div>`
          : '<p class="muted">No stock items yet. Create items under Inventory (I) to record quantities with this voucher.</p>'}
      </div>`
    : '';

  return `
    <form id="voucher-form" class="voucher-form" novalidate>
      <div class="voucher-head">
        <div>
          <p class="eyebrow">${editing ? 'Voucher alteration' : 'Voucher entry'}</p>
          <h1>${editing ? 'Alter' : 'New'} ${esc(meta.label)} voucher <span class="badge">${meta.shortcut}</span></h1>
        </div>
        <div class="voucher-meta">
          <span class="label">No.</span><strong>${nextNo}</strong>
          <label class="field inline-field">
            <span>Currency</span>
            <select name="currencyCode" aria-label="Voucher currency">${currencyOptions}</select>
          </label>
          <label class="field inline-field">
            <span>Rate (INR)</span>
            <input name="exchangeRate" inputmode="decimal" placeholder="—" value="${esc(rateValue)}"${foreign ? '' : ' disabled'} aria-label="Exchange rate to INR">
          </label>
          <label class="field inline-field">
            <span>Date</span>
            <input name="date" type="date" value="${esc(draft.date)}" min="${esc(booksStart(active))}"
              max="${esc((active.years?.length ? active.years[active.years.length - 1] : { end: active.fyEnd }).end)}" required>
          </label>
        </div>
      </div>
      ${ledgerDatalistHtml()}
      ${foreign ? `<p class="muted small currency-hint">Amounts are entered in ${esc(draft.currencyCode)} and posted to the books in INR at the rate above. Stock items and bill-wise settlement are not available on foreign vouchers yet.</p>` : ''}
      <table class="lines-table">
        <thead><tr><th>Particulars</th><th>Dr/Cr</th><th class="num">Amount${foreign ? ` (${esc(draft.currencyCode)})` : ''}</th><th>Cost centre</th><th></th></tr></thead>

        <div id="voucher-totals" class="totals"></div>
      </div>
      ${inventoryBlock}
      ${gstVoucherBlock(active)}
      ${tdsVoucherBlock(active)}
      ${billFields}
      ${settlementBlock}
      ${instrumentBlock}
      <label class="field">

function voucherViewScreen() {
  const active = company();
  if (!active) return emptyCompanyScreen('Voucher');
  const voucher = active.vouchers.find((item) => item.id === view.id);
  if (!voucher) return panel('Voucher', '<p class="muted">That voucher no longer exists.</p>');
  const voucherCurrency = voucher.currencyCode
    ? (active.currencies ?? []).find((currency) => currency.code === voucher.currencyCode)
    : null;
  const foreignMoney = (value) => `${esc(voucher.currencyCode)} ${round2(value).toFixed(2)}`;

  const rows = voucher.lines
    .map((line) => {
      const ledger = active.ledgers.find((item) => item.id === line.ledgerId);
      const group = ledger ? groupById(active, ledger.groupId) : null;
      const costCentre = line.costCentreId
        ? (active.costCentres ?? []).find((centre) => centre.id === line.costCentreId)
        : null;
      const allocations = (line.allocations ?? [])
        .map((allocation) => {
          const bill = active.vouchers.find((item) => item.id === allocation.voucherId);
          return bill ? `Settles ${billLabel(bill)} · ${money(allocation.amount)}` : '';
        })
        .filter(Boolean);
      return `<tr>
        <td>${esc(ledger?.name ?? 'Unknown')}${costCentre ? `<div class="muted small">Cost centre: ${esc(costCentre.name)}</div>` : ''}${allocations.length ? `<div class="muted small">${allocations.map(esc).join('<br>')}</div>` : ''}</td>
        <td class="muted">${esc(group?.name ?? '')}</td>
        <td class="num">${line.side === 'Dr' ? (voucherCurrency ? `${foreignMoney(line.currencyAmount)}<div class="muted small">${money(line.amount)}</div>` : money(line.amount)) : ''}</td>
        <td class="num">${line.side === 'Cr' ? (voucherCurrency ? `${foreignMoney(line.currencyAmount)}<div class="muted small">${money(line.amount)}</div>` : money(line.amount)) : ''}</td>
      </tr>`;
    })
    .join('');

  const stockRows = (voucher.items ?? [])
    .map((line) => {
      const item = (active.stockItems ?? []).find((entry) => entry.id === line.stockItemId);
      const unit = (active.units ?? []).find((entry) => entry.id === item?.unitId)?.symbol ?? '';
      const godown = (active.godowns ?? []).find((entry) => entry.id === (line.godownId || defaultGodownId(active)));
      const batch = line.batchNo ? ` · batch ${line.batchNo}` : '';
      const expiry = line.expiryDate ? ` · exp ${dateLabel(line.expiryDate)}` : '';
      return `<tr>
        <td>${esc(item?.name ?? 'Unknown item')}<div class="muted small">${esc(godown?.name ?? 'Main Location')}${esc(batch)}${esc(expiry)}</div></td>
        <td class="num">${fmtQty(line.qty)}${unit ? ` ${esc(unit)}` : ''}</td>
        <td class="num">${money(line.rate)}</td>
        <td class="num">${money(line.amount ?? round2(line.qty * line.rate))}</td>
      </tr>`;
    })
    .join('');
  const stockBlock = stockRows
    ? `<h2 class="section-title">Stock items</h2>
       <table class="data-table compact">
         <thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Rate</th><th class="num">Amount</th></tr></thead>
         <tbody>${stockRows}</tbody>
       </table>`
    : '';

  return `
    ${panel(
      `${esc(voucherLabel(voucher.type))} ${voucher.no}`,
      `<div class="voucher-view-meta">
        <div><span class="label">Date</span><strong>${esc(dateLabel(voucher.date))}</strong></div>
        <div><span class="label">Amount</span><strong>${money(voucher.total)}</strong></div>
        ${voucherCurrency ? `<div><span class="label">Currency</span><span>${foreignMoney(voucher.currencyTotal)} @ ${money(voucher.exchangeRate)}<br><span class="muted small">${esc(voucherCurrency.name)}</span></span></div>` : ''}
        ${voucher.bill ? `<div><span class="label">Bill</span><span>${esc(voucher.bill.ref || '—')}${voucher.bill.dueDate ? ` · due ${esc(dateLabel(voucher.bill.dueDate))}` : ''}</span></div>` : ''}
        ${voucher.instrument ? `<div><span class="label">Instrument</span><span>${esc(voucher.instrument.kind)} ${esc(voucher.instrument.number)} · ${esc(dateLabel(voucher.instrument.date))}<br><span class="muted small">${esc(active.ledgers.find((ledger) => ledger.id === voucher.instrument.bankLedgerId)?.name ?? 'Unknown bank')}</span></span></div>` : ''}
        ${voucher.tds ? `<div><span class="label">${esc(voucher.tds.kind)}</span><span>${esc(voucher.tds.code)} · ${voucher.tds.rate}%<br><span class="muted small">Base ${money(voucher.tds.base)} · ${voucher.tds.kind.toLowerCase()} ${money(voucher.tds.amount)}${voucher.tds.pan ? ` · PAN ${esc(voucher.tds.pan)}` : ''}</span></span></div>` : ''}
        ${voucher.gst ? `<div><span class="label">GST</span><span>${esc(gstRateLabel(voucher.gst.rate, voucher.gst.cessRate))} · ${esc(voucher.gst.supplyType)}<br><span class="muted small">Taxable ${money(voucher.gst.taxable)} · tax ${money(round2(voucher.gst.cgst + voucher.gst.sgst + voucher.gst.igst + voucher.gst.cess))}${voucher.gst.partyGstin ? ` · ${esc(voucher.gst.partyGstin)}` : ''}${voucher.gst.reverseCharge ? ' · RCM' : ''}</span></span></div>` : ''}
        <div><span class="label">Narration</span><span>${esc(voucher.narration || '—')}</span></div>
      </div>
      <table class="data-table">
        <thead><tr><th>Particulars</th><th>Group</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="2"></td><td class="num">${money(voucher.total)}</td><td class="num">${money(voucher.total)}</td></tr></tfoot>
      </table>
      ${stockBlock}
      <div class="form-actions">
        <button class="btn ghost" type="button" data-screen="daybook">Back to Day Book</button>
        <button class="btn" type="button" data-action="alter-voucher" data-id="${esc(voucher.id)}">Alter voucher</button>
        ${voucher.instrument?.kind === 'Cheque' && voucher.type === 'Payment' ? `<button class="btn" type="button" data-action="print-cheque" data-id="${esc(voucher.id)}">Print cheque</button>` : ''}
        <button class="btn" type="button" data-action="duplicate-voucher" data-id="${esc(voucher.id)}">Duplicate</button>
        <button class="btn danger" type="button" data-action="delete-voucher" data-id="${esc(voucher.id)}">Delete voucher</button>
      </div>`,
    )}`;
}

      `${primaryName('sales')} less ${primaryName('purchase')} and direct expenses · ${esc(dateLabel(report.from))} to ${esc(dateLabel(report.to))}`,

    ${panel(
      'Profit & Loss Account',
      `<div class="report-grid">
        <div>

    `<form id="cashbook-form" class="filter-bar">

}
